name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suggested_urls:
        description: "Suggested links, one per line as Name|https://example.com. Overrides the XTREAM_URLS variable for this build."
        required: false
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Apply suggested URLs
        env:
          FROM_INPUT: ${{ inputs.suggested_urls }}
          FROM_VAR: ${{ vars.XTREAM_URLS }}
        run: |
          set -euo pipefail
          file="android/app/src/main/assets/suggested.txt"
          mkdir -p "$(dirname "$file")"
          if [ -n "${FROM_INPUT:-}" ]; then
            printf '%s\n' "${FROM_INPUT}" > "$file"
          elif [ -n "${FROM_VAR:-}" ]; then
            printf '%s\n' "${FROM_VAR}" > "$file"
          fi

      - name: Refresh ad block list
        run: |
          set -euo pipefail
          dest="android/app/src/main/assets/adblock.txt"
          tmp="$(mktemp)"
          : > "$dest.fetched"
          curl -fsSL --retry 2 --max-time 90 \
            "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext" \
            -o "$tmp" || true
          if [ -s "$tmp" ]; then
            awk 'BEGIN{IGNORECASE=1} /^#/ || NF==0 {next} {host=tolower($NF); if (host ~ /^[a-z0-9.-]+$/ && host ~ /\./) print host}' "$tmp" >> "$dest.fetched"
          fi
          if [ -s "$dest.fetched" ]; then
            cat "$dest" "$dest.fetched" | awk 'NF && !seen[$0]++' > "$dest.merged"
            mv "$dest.merged" "$dest"
          fi
          rm -f "$tmp" "$dest.fetched"

      - name: Validate playback rules
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew :app:testTvDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APKs
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/tv/debug/app-tv-debug.apk xtream-tv.apk
          cp android/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk xtream-mobile.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: xtream-apks
          path: |
            xtream-tv.apk
            xtream-mobile.apk
          if-no-files-found: error

      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="Video streams load again. Ad hosts stay blocked. File downloads stay refused."
          if gh release view v1.6.0 >/dev/null 2>&1; then
            gh release upload v1.6.0 xtream-tv.apk xtream-mobile.apk --clobber
          else
            gh release create v1.6.0 xtream-tv.apk xtream-mobile.apk \
              --title "Xtream 1.6.0" \
              --notes "$notes"
          fi
